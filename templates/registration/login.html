{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block auth %}
<h1 class="auth-title">Log in</h1>
<form method="post" class="stack" novalidate>
  {% csrf_token %}
  {% if form.non_field_errors %}<div class="form-error">{{ form.non_field_errors.0 }}</div>{% endif %}
  {% for field in form %}{% include "partials/_field.html" %}{% endfor %}
  <input type="hidden" name="next" value="{{ next }}">
  <button type="submit" class="btn btn-primary btn-block">Log in</button>
</form>
<p class="auth-alt">New here? <a href="{% url 'signup' %}">Create an account</a></p>
{% endblock %}
